version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      androidx-compose:
        patterns: ["androidx.*", "org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      google:
        patterns: ["com.google.*"]

  - package-ecosystem: npm
    directory: "/admin-web"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    groups:
      actions:
        patterns: ["*"]
