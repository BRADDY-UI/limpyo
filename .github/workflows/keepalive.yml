name: keepalive

# Supabase free projects pause after 7 days without activity.
# This calls the public health() function every 3 days so they stay awake.
on:
  schedule:
    - cron: "23 1 */3 * *" # 01:23 UTC every 3rd day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env: [dev] # add "prod" when limpyo-prod exists
    steps:
      - name: Call health()
        env:
          URL: ${{ matrix.env == 'dev' && secrets.SUPABASE_DEV_URL || secrets.SUPABASE_PROD_URL }}
          KEY: ${{ matrix.env == 'dev' && secrets.SUPABASE_DEV_ANON_KEY || secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing Supabase URL or anon/publishable key secret for ${{ matrix.env }}"
            exit 1
          fi
          body=$(curl -fsS --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "$URL/rest/v1/rpc/health" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$body"
          echo "$body" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'
