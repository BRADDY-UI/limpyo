name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node design/scripts/build-tokens.mjs --check

  build:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # google-services.json is git-ignored. Use the real one from a repo secret when it's
      # available (pushes to main); fall back to a harmless placeholder for forks and PRs.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # The secret may be stored as raw JSON or as base64; both work. The value is never printed.
        run: |
          out=app/google-services.json
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cp .github/ci/google-services.placeholder.json "$out"
          elif printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$out"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 --decode > "$out" || {
              echo "::error::GOOGLE_SERVICES_JSON is neither JSON nor valid base64. Re-create the secret."
              exit 1
            }
          fi
          jq -e '.client[0].client_info.android_client_info.package_name' "$out" > /dev/null || {
            echo "::error::GOOGLE_SERVICES_JSON does not look like a google-services.json file."
            exit 1
          }

      - name: Lint, test, build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
